<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0505">
  <title>NIRNOY Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="calculator" id="calculator">

    <!-- HEADER (Brand, Sound & Mode Switch) -->
    <div class="header">
      <div class="brand">N I <span>R N </span>O Y</div>
      <div class="header-controls">
        <button class="sound-btn" id="soundBtn" title="Toggle Sound">
          <svg id="soundIcon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        
        <!-- Restored Slide Transformation Button -->
        <div class="mode-switch" id="modeToggleBtn" title="Toggle Scientific Mode">
          <div class="switch-slider"></div>
          <span class="switch-text active">Basic</span>
          <span class="switch-text">Sci</span>
        </div>
      </div>
    </div>

    <!-- DISPLAY -->
    <div class="display">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="current" id="current">0</div>
    </div>

    <!-- SAMSUNG STYLE TOOLBAR ROW -->
    <div class="toolbar">
      <div class="toolbar-left">
        <!-- History Button -->
        <button class="icon-btn" id="historyBtn" title="History">
          <svg viewBox="0 0 24 24">
            <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
        </button>
      </div>
      <div class="toolbar-right">
        <!-- Backspace Button -->
        <button class="icon-btn" id="backspaceBtn" title="Backspace">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- KEYPAD WRAPPER -->
    <div class="keys-wrapper" id="keys">
      
      <!-- SCIENTIFIC PAD -->
      <div class="sci-pad" id="sciPad">
        <button class="key sci-key" data-action="sin">sin</button>
        <button class="key sci-key" data-action="cos">cos</button>
        <button class="key sci-key" data-action="tan">tan</button>
        <button class="key sci-key" data-action="asin">sin⁻¹</button>
        <button class="key sci-key" data-action="acos">cos⁻¹</button>
        <button class="key sci-key" data-action="atan">tan⁻¹</button>
        <button class="key sci-key" data-action="log">log₁₀</button>
        <button class="key sci-key" data-action="ln">ln</button>
        <button class="key sci-key" data-action="e">e</button>
        <button class="key sci-key" data-action="sqr">x²</button>
        <button class="key sci-key" data-action="cube">x³</button>
        <button class="key sci-key" data-action="pow">xʸ</button>
        <button class="key sci-key" data-action="sqrt">√x</button>
        <button class="key sci-key" data-action="cbrt">∛x</button>
        <button class="key sci-key" data-action="pi">π</button>
      </div>

      <!-- BASIC PAD -->
      <div class="basic-pad" id="basicPad">
        <button class="key function" data-action="clear">AC</button>
        <button class="key function" data-action="paren">( )</button>
        <button class="key function" data-action="percent">%</button>
        <button class="key operator" data-op="÷">÷</button>

        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key operator" data-op="×">×</button>

        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key operator" data-op="−">−</button>

        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key operator" data-op="+">+</button>

        <button class="key zero" data-num="0">0</button>
        <button class="key" data-action="decimal">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

    </div>

    <!-- HISTORY DRAWER -->
    <div class="history-panel" id="historyPanel">
      <div class="history-header">
        <span>History</span>
        <button class="icon-btn" id="closeHistoryBtn" title="Close">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="history-list" id="historyList"></div>
      <button class="clear-history-btn" id="clearHistoryBtn">Clear history</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
